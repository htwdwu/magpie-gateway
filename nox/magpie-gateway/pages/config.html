<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>Magpie 网关设置</title>
<style>
  :root {
    --bg: #f5f6f7;
    --surface: #ffffff;
    --surface-sunken: #eff1f3;
    --line: #e2e5e8;
    --text: #16191c;
    --muted: #566068;
    --accent: #0f766e;
    --accent-ink: #ffffff;
    --danger: #b42318;
    --danger-weak: #fdecea;
    --warn: #b54708;
    --warn-weak: #fef4e6;
    --ok: #12805c;
    --radius: 12px;
    --radius-sm: 9px;
    --pad: 16px;
    --font: -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101315; --surface: #171b1e; --surface-sunken: #1e2327; --line: #2a3035;
      --text: #e8ebed; --muted: #a7b0b7; --accent: #2dd4bf; --accent-ink: #06201d;
      --danger: #ff8a7d; --danger-weak: #2d1815; --warn: #f5c26b; --warn-weak: #2b2011; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0 0 calc(124px + env(safe-area-inset-bottom));
    background: var(--bg); color: var(--text);
    font: 15px/1.6 var(--font); font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 16px var(--pad) 0; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0 0 2px; font-size: 19px; line-height: 1.3; font-weight: 650; letter-spacing: -.01em; }
  .sub { margin: 0; font-size: 12.5px; color: var(--muted); }

  .strip {
    background: var(--surface); border-radius: 14px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    box-shadow: 0 1px 2px color-mix(in srgb, var(--text) 6%, transparent);
  }
  .strip .who { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #9aa3ab; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 18%, transparent); }
  .strip .addr { font: 12px/1.4 var(--mono); color: var(--muted); text-align: right; word-break: break-all; }

  .notice-callout {
    display: none; margin: 0; padding: 10px 12px; border-radius: var(--radius-sm);
    border-left: 3px solid var(--warn); background: var(--warn-weak); color: var(--warn);
    font-size: 13px; line-height: 1.55; white-space: pre-wrap;
  }
  .notice-callout.show { display: block; }
  .notice-callout.show::before { content: "! "; font-weight: 700; }
  .notice-callout.is-error { border-left-color: var(--danger); background: var(--danger-weak); color: var(--danger); }

  section { display: flex; flex-direction: column; gap: 14px; }
  h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .field label { display: block; font-size: 13px; font-weight: 550; margin-bottom: 6px; }
  .hint { margin: 6px 0 0; font-size: 12px; line-height: 1.5; color: var(--muted); }
  input, select {
    width: 100%; min-height: 46px; padding: 11px 12px; font: inherit; font-size: 16px;
    color: var(--text); background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-sm); appearance: none;
  }
  select {
    padding-right: 34px;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row2 { display: flex; gap: 10px; }
  .row2 > .field { flex: 1 1 0; min-width: 0; }

  button {
    font: inherit; color: var(--text); cursor: pointer;
    border: 0; background: var(--surface-sunken);
    border-radius: var(--radius); min-height: 44px; padding: 0 16px;
    font-size: 14.5px; font-weight: 550; transition: transform .12s ease, opacity .18s ease;
  }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .45; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 650; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { min-height: 36px; padding: 0 12px; font-size: 13px; font-weight: 500; color: var(--muted); background: transparent; }

  .logcard { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 2px color-mix(in srgb, var(--text) 6%, transparent); }
  .logcard header { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 8px 12px; border-bottom: 1px solid var(--line); }
  .logcard header .t { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .logcard .btns { display: flex; gap: 6px; }
  .logcard .btns button { min-height: 30px; padding: 0 10px; font-size: 12px; background: transparent; border-color: transparent; color: var(--accent); }
  pre {
    margin: 0; padding: 12px; max-height: 240px; overflow: auto;
    font: 12px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word;
  }

  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 10px var(--pad) calc(10px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  }
  .savebar button { width: 100%; }
  .bridge-warn { display: none; margin: 12px var(--pad) 0; padding: 10px 12px; border-radius: var(--radius-sm);
    background: var(--danger-weak); color: var(--danger); font-size: 13px; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div class="bridge-warn" id="bridgeWarn"></div>

  <div class="wrap">
    <div>
      <h1>网关设置</h1>
      <p class="sub">改动保存后，本插件启动的网关会自动重启。</p>
    </div>

    <div class="strip">
      <span class="who"><i class="dot" id="dot"></i><span id="status">读取中</span></span>
      <span class="addr" id="gatewayUrl">—</span>
    </div>
    <div class="strip" id="webRow" style="display:none">
      <span class="who" style="font-weight:500;font-size:13px;color:var(--muted)">网页版</span>
      <span class="addr" id="webUrl">—</span>
    </div>
    <div class="notice-callout" id="notice"></div>

    <section>
      <h2>启动方式</h2>
      <div class="field">
        <label for="startMode">运行模式</label>
        <select id="startMode">
          <option value="web">网关 + 网页控制台</option>
          <option value="serve">仅网关</option>
        </select>
      </div>
      <div class="field">
        <label for="autoStart">随 App 自动启动</label>
        <select id="autoStart"><option value="1">开</option><option value="0">关</option></select>
      </div>
    </section>

    <section>
      <h2>端口与访问</h2>
      <div class="row2">
        <div class="field">
          <label for="gatewayPort">网关端口</label>
          <input id="gatewayPort" type="number" min="1" max="65535" inputmode="numeric" />
        </div>
        <div class="field" data-when="web">
          <label for="webPort">网页版端口</label>
          <input id="webPort" type="number" min="1" max="65535" inputmode="numeric" />
        </div>
      </div>
      <p class="hint">供应商入口固定指向 3425，改端口后那里会连不上。</p>
      <div class="field" data-when="web">
        <label for="webKey">网页版 key</label>
        <input id="webKey" type="text" maxlength="64" placeholder="留空则每次启动随机生成" autocomplete="off" />
      </div>
    </section>

    <section>
      <h2>安装</h2>
      <div class="field">
        <label for="proxyMode">代理用法</label>
        <select id="proxyMode">
          <option value="off">不用代理</option>
          <option value="fallback">直连失败再用</option>
          <option value="always">始终使用</option>
        </select>
      </div>
      <div class="field" data-when="proxy">
        <label for="proxy">代理地址</label>
        <input id="proxy" type="text" maxlength="200" placeholder="http://127.0.0.1:10808" autocomplete="off" />
      </div>
      <div class="chips">
        <button data-act="act-install" data-busy>安装 / 重装</button>
        <button data-act="act-check" data-busy>检查网关</button>
        <button data-act="act-diag" data-busy>环境自检</button>
      </div>
    </section>

    <div class="logcard">
      <header>
        <span class="t" id="logTitle">安装日志</span>
        <span class="btns">
          <button data-act="act-log">实时</button>
          <button data-act="act-copy-log">复制</button>
        </span>
      </header>
      <pre id="log">（暂无日志）</pre>
    </div>
  </div>

  <div class="savebar">
    <button class="primary" data-act="act-save" data-busy>保存设置</button>
  </div>

  <script src="/__aicode/aicode.js"></script>
  <script src="ui.js"></script>
  <script src="config.js"></script>
</body>
</html>
